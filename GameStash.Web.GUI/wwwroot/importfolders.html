<div class="import-container">
    <div class="import-header-row">
        <h1 class="import-title">Import Games</h1>
    </div>

    <!-- Toolbar Superior -->
    <div class="import-toolbar">
        <div class="toolbar-left-group">
            <button id="import-refresh-btn" class="toolbar-action-btn">↻ Rescan Root Folders</button>
            <button id="import-match-selected-btn" class="toolbar-action-btn" disabled>🔍 IGDB Match Selected</button>
        </div>
        <button id="import-help-btn" class="help-btn" title="Help">❓ Help</button>
    </div>

    <!-- Checkbox Bar -->
    <div class="selection-checkboxes-bar">
        <label class="custom-checkbox-label">
            <input type="checkbox" id="import-check-all" /> Select All
        </label>
        <label class="custom-checkbox-label">
            <input type="checkbox" id="import-check-all-matched" /> Select All with Match
        </label>
        <label class="custom-checkbox-label">
            <input type="checkbox" id="import-check-page" /> Select All in Page
        </label>
    </div>

    <!-- Table Wrapper (Elástico com scroll vertical e horizontal automático) -->
    <div class="import-table-wrapper">
        <table class="import-table">
            <thead>
                <tr>
                    <th class="col-checkbox">[-]</th>
                    <th class="col-match-name">Match Name</th>
                    <th class="col-type">Type</th>
                    <th class="col-folder">Folder</th>
                    <th class="col-matched-game">Matched Game</th>
                </tr>
            </thead>
            <tbody id="import-table-body">
                <!-- Injetado dinamicamente via JS -->
            </tbody>
        </table>
    </div>

    <!-- Barra Inferior de Paginação e Execução -->
    <div class="import-footer-bar">
        <div class="import-pagination-bar">
            <!-- Removido o style embutido daqui -->
            <div id="pagination-numbers-container"></div>

            <span class="pagination-info">
                <span id="pagination-info">Page 1 of 1</span>
                <span class="pagination-divider">•</span>
                <strong id="import-count-badge">0</strong> total folders
            </span>
        </div>

        <button id="import-execute-btn" class="import-submit-btn">✓ Import Selected</button>
    </div>
</div>
