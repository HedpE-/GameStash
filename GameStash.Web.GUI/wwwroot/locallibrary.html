<div class="library-container">
    <!-- Header with Title & Counter -->
    <div class="library-header-row">
        <h1 class="library-title">Local Games Library</h1>
        <span id="lib-count-badge" class="library-count-badge">0</span>
    </div>

    <!-- Actions & Toolbar Bar -->
    <div class="library-toolbar">
        <div class="toolbar-left-actions">
            <button type="button" id="lib-reload-btn" class="toolbar-action-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
                <span>Reload Library</span>
            </button>
            <button type="button" id="lib-export-btn" class="toolbar-action-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                </svg>
                <span>Export List to Clipboard</span>
            </button>
        </div>

        <!-- Barra de Progresso Central (Espelho do WPF ProgressBar) -->
        <div id="lib-sync-progress-box" class="toolbar-progress-center" style="display: none;">
            <span id="lib-sync-text" class="progress-label">Synchronizing with IGDB...</span>
            <div class="progress-track">
                <div id="lib-sync-bar" class="progress-fill" style="width: 0%;"></div>
            </div>
        </div>

        <div class="toolbar-right-actions">
            <!-- Sort Popup -->
            <div class="dropdown-container">
                <button type="button" id="lib-sort-toggle" class="toolbar-dropdown-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="11" y1="5" x2="11" y2="19"></line>
                        <polyline points="7 9 11 5 15 9"></polyline>
                        <line x1="17" y1="19" x2="17" y2="11"></line>
                        <polyline points="13 15 17 19 21 15"></polyline>
                    </svg>
                    <span id="lib-sort-label">Sort: Name ↑</span>
                </button>
                <div id="lib-sort-menu" class="dropdown-menu">
                    <div class="dropdown-item active" data-sort="Name">Name <span class="sort-indicator">↑</span></div>
                    <div class="dropdown-item" data-sort="Release Date">Release Date <span class="sort-indicator"></span></div>
                    <div class="dropdown-item" data-sort="Rating">Rating <span class="sort-indicator"></span></div>
                    <div class="dropdown-item" data-sort="Date Added">Date Added <span class="sort-indicator"></span></div>
                    <div class="dropdown-item" data-sort="Folder Size">Folder Size <span class="sort-indicator"></span></div>
                </div>
            </div>

            <!-- Filter Popup -->
            <div class="dropdown-container">
                <button type="button" id="lib-filter-toggle" class="toolbar-dropdown-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                    </svg>
                    <span id="lib-filter-label">Filter: All</span>
                </button>
                <div id="lib-filter-menu" class="dropdown-menu">
                    <div class="dropdown-item active" data-filter="All">All</div>
                    <div class="dropdown-item" data-filter="Favorites">Favorites</div>
                    <div class="dropdown-item" data-filter="Not Favorites">Not Favorites</div>
                    <div class="dropdown-item" data-filter="Installed">Installed</div>
                    <div class="dropdown-item" data-filter="Not Installed">Not Installed</div>
                    <div class="dropdown-item" data-filter="Missing">Missing Folder</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Spinner Inicial Apenas se a base de dados estiver vazia -->
    <div id="lib-loading-indicator" class="lib-loading-indicator" style="display: none;">
        <div class="spinner"></div>
        <p class="loading-text">Loading library items...</p>
    </div>

    <!-- Workspace com a Grelha e a Barra de Letras -->
    <div id="lib-workspace" class="library-workspace">
        <div id="lib-games-grid" class="library-games-grid"></div>
        <div id="lib-alphabet-bar" class="library-alphabet-bar"></div>
    </div>
</div>

<!-- Modal: Edit Sort Name Dialog -->
<div id="lib-edit-modal" class="modal-overlay">
    <div class="modal-dialog-card">
        <h3>Edit Game Entry</h3>
        <input type="text" id="lib-edit-sortname-input" class="search-input" style="margin: 15px 0;" placeholder="Sort Name" />
        <div class="dialog-actions">
            <button type="button" id="lib-edit-save-btn" class="dialog-btn primary">Save</button>
            <button type="button" id="lib-edit-close-btn" class="dialog-btn">Close</button>
        </div>
    </div>
</div>

<!-- Modal: Delete Confirmation Dialog -->
<div id="lib-delete-modal" class="modal-overlay">
    <div class="modal-dialog-card">
        <h3 style="color: #ff5252;">Remove Game Entry</h3>
        <p id="lib-delete-message" style="margin: 15px 0; font-size: 14px; line-height: 1.5; color: var(--text-muted);"></p>
        <div class="dialog-actions">
            <button type="button" id="lib-delete-confirm-btn" class="dialog-btn danger">Yes</button>
            <button type="button" id="lib-delete-cancel-btn" class="dialog-btn">No</button>
        </div>
    </div>
</div>
